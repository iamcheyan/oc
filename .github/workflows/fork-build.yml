name: Fork Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: fork-build-macos-arm64
          - os: ubuntu-latest
            artifact_name: fork-build-linux-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream dev
        run: git fetch https://github.com/anomalyco/opencode.git dev:refs/remotes/upstream/dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check upstream seam allowlist
        run: bash fork/check-upstream-seams.sh

      - name: Build upstream CLI and Vim plugin
        run: bash fork/build.sh

      - name: Host resolve and load check
        run: bun run fork/check-plugin-load.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: |
            packages/cli/dist/**
            fork/dist/plugin/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        run: |
          set -euo pipefail
          bundle="artifacts/fork-build-linux-x64-${GITHUB_SHA}/fork/dist/plugin"
          test -f "$bundle/index.js"
          test -f "$bundle/tui.js"
          test -f "$bundle/package.json"
          tar -czf "opencode-vim-plugin.tar.gz" -C "$bundle" .
          tar -tzf "opencode-vim-plugin.tar.gz" | grep -q '^\./tui.js$'
          tar -xOf "opencode-vim-plugin.tar.gz" ./package.json | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["exports"]["./tui"]=="./tui.js"'

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            opencode-vim-plugin.tar.gz
